name: Build anime pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'
  push:
    paths:
      - 'scripts/build-anime-pages.js'
      - '.github/workflows/build-anime-pages.yml'

permissions:
  contents: write

concurrency:
  group: build-anime-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate pages
        run: node scripts/build-anime-pages.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime titles sitemap-anime.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 作品ページを再生成"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
